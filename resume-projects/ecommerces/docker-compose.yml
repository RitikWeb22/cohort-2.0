version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: kora-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: kora

  redis:
    image: redis:7.2-alpine
    container_name: kora-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kora-api
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/kora
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongo
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kora-client
    restart: always
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongo_data:
  redis_data:
